<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>404 — Access path not found · Rahul Krishnan</title>
<link rel="icon" href="/assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;height:100%}
  body{background:#050816;color:#e7ebf5;font-family:"Space Grotesk",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px}
  .blob{position:fixed;width:50vw;height:50vw;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0}
  .b1{background:radial-gradient(circle,rgba(79,143,255,.6),transparent 60%);left:-10vw;top:-10vh}
  .b2{background:radial-gradient(circle,rgba(168,85,247,.5),transparent 60%);right:-10vw;bottom:-10vh}
  .wrap{position:relative;z-index:1}
  .code{font-family:"JetBrains Mono",monospace;color:#39d6e6;font-size:13px;letter-spacing:.2em;margin-bottom:14px}
  h1{font-size:clamp(60px,16vw,140px);font-weight:700;margin:0;background:linear-gradient(100deg,#6fa6ff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#8a93a8;max-width:420px;margin:10px auto 26px;font-family:system-ui,sans-serif}
  a{display:inline-flex;gap:8px;align-items:center;padding:12px 22px;border-radius:13px;border:1px solid rgba(255,255,255,.1);
    background:linear-gradient(100deg,#4f8fff,#a855f7);color:#fff;text-decoration:none;font-size:15px;font-weight:500}
  a:hover{box-shadow:0 14px 40px -10px rgba(79,143,255,.6)}
  :focus-visible{outline:2px solid #6fa6ff;outline-offset:3px}
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="wrap">
    <div class="code">// HTTP 404 · RESOURCE NOT FOUND</div>
    <h1>404</h1>
    <p>This path isn't in scope. The page you requested doesn't exist or has been moved.</p>
    <a href="/">← Return to homepage</a>
  </div>
</body>
</html>
